name: KLU and YouTube Scraper Automation

# Controls when the workflow will run
on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour at minute 0 (e.g., 12:00, 13:00)
  workflow_dispatch:     # Allows manual triggering from the GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest # The type of runner that the job will execute on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute scraper script
        env:
          # Injecting repository secrets into the environment safely
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scraper.py